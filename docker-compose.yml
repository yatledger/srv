# Локальный кластер dagdb из 4 узлов + Redis.
# Запуск: docker compose up --build
# Порт каждого узла: node1=21001, node2=21002, node3=21003, node4=21004.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "CHANGE_ME"]

  node1:
    build: .
    environment:
      NODE_ID: "1"
      ADVERTISE_ADDR: "node1:21001"
      BIND_ADDR: "0.0.0.0:21001"
      HTTP_PORT: "21001"
      DATA_DIR: "/data"
      REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
      INTERNAL_API_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
      RUST_LOG: "info"
    command: ["--id", "1", "--addr", "node1", "--port", "21001"]
    volumes:
      - node1-data:/data
    ports:
      - "21001:21001"
    depends_on:
      - redis

  node2:
    build: .
    environment:
      NODE_ID: "2"
      ADVERTISE_ADDR: "node2:21002"
      BIND_ADDR: "0.0.0.0:21002"
      HTTP_PORT: "21002"
      DATA_DIR: "/data"
      REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
      INTERNAL_API_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
      RUST_LOG: "info"
    command: ["--id", "2", "--addr", "node2", "--port", "21002"]
    volumes:
      - node2-data:/data
    ports:
      - "21002:21002"
    depends_on:
      - redis

  node3:
    build: .
    environment:
      NODE_ID: "3"
      ADVERTISE_ADDR: "node3:21003"
      BIND_ADDR: "0.0.0.0:21003"
      HTTP_PORT: "21003"
      DATA_DIR: "/data"
      REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
      INTERNAL_API_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
      RUST_LOG: "info"
    command: ["--id", "3", "--addr", "node3", "--port", "21003"]
    volumes:
      - node3-data:/data
    ports:
      - "21003:21003"
    depends_on:
      - redis

  node4:
    build: .
    environment:
      NODE_ID: "4"
      ADVERTISE_ADDR: "node4:21004"
      BIND_ADDR: "0.0.0.0:21004"
      HTTP_PORT: "21004"
      DATA_DIR: "/data"
      REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
      INTERNAL_API_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
      RUST_LOG: "info"
    command: ["--id", "4", "--addr", "node4", "--port", "21004"]
    volumes:
      - node4-data:/data
    ports:
      - "21004:21004"
    depends_on:
      - redis

  # Одноразовый bootstrap: инициализирует кластер из 4 узлов и грузит генезис.
  init:
    image: curlimages/curl:8.10.1
    depends_on:
      - node1
      - node2
      - node3
      - node4
    environment:
      INTERNAL_API_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for node1...";
        until curl -sf http://node1:21001/pool >/dev/null; do sleep 1; done
        echo "initializing cluster...";
        curl -sf -X POST -H "Content-Type: application/json" \
          -H "x-internal-token: $${INTERNAL_API_TOKEN}" \
          -d '[[1,"node1:21001"],[2,"node2:21002"],[3,"node3:21003"],[4,"node4:21004"]]' \
          http://node1:21001/mng/init || true
        echo "waiting for leader...";
        until curl -s -X POST -H "x-internal-token: $${INTERNAL_API_TOKEN}" \
          http://node1:21001/mng/metrics | grep -q '"current_leader":[0-9]'; do sleep 1; done
        echo "loading genesis...";
        curl -sf -X POST -H "Content-Type: application/json" \
          -H "x-internal-token: $${INTERNAL_API_TOKEN}" -d '[]' \
          http://node1:21001/load-genesis
        echo "cluster ready."

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
