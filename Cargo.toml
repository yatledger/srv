[package]
name = "dagdb"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7" # Фреймворк для создания HTTP-сервера.
num_cpus = "1.17.0"
rand = "0.9.1"
rayon = "1.10.0"
redis = { version = "0.32.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] } # Для сериализации/десериализации JSON.
serde_json = "1.0" # Для работы с JSON в graph.rs.
tokio = { version = "1.0", features = ["full"] } # Асинхронный runtime.
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
